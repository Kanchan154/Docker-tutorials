services:
  # backend
  backend:
    build: ./backend
    environment:
      - PORT=5000
    env_file:
      - ./backend/.env
    ports:
      - 5000:5000

  # frontend 
  frontend:
    build: ./frontend
    ports:
      - 5173:5173

  # redis 
  redis: 
    image: redis
    ports:
      - 6379:6379