services:

  redis:
    image: redis
    ports:
      - "6379:6379"

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  server1:
    build: ./server \
    env_file:
      - ./server/.env
    environment:
      - SERVER_NAME=SERVER - 1
    ports:
      - "5000:5000"
  
  server2:
    build: ./server \
    environment:
      - SERVER_NAME=SERVER - 2
    env_file:
      - ./server/.env
    ports:
      - "5001:5000"

  server3:
    build: ./server \
    environment:
      - SERVER_NAME=SERVER - 3
    env_file:
      - ./server/.env
    ports:
      - "5002:5000"
