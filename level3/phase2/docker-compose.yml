services:
  ngnix:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  gateway1:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      - SERVER_NAME=SERVER-1
    ports:
      - "7001:8000"

  gateway2:
    build: ./backend/gateway
    environment:
      - SERVER_NAME=SERVER-2
    env_file:
      - ./backend/gateway/.env
    ports:
      - "7002:8000"

  auth_service:
    build: ./backend/services/auth
    environment:
      - SERVER_NAME=SERVER-1
    env_file:
      - ./backend/services/auth/.env
    ports:
      - "5001:8001"

  order_service:
    build: ./backend/services/order
    environment:
      - SERVER_NAME=SERVER-1
    env_file:
      - ./backend/services/order/.env
    ports:
      - "5002:8002"

  payment_service:
    build: ./backend/services/payment
    env_file:
      - ./backend/services/payment/.env
    environment:
      - SERVER_NAME=SERVER-1
    ports:
      - "5003:8003"

  product_service:
    build: ./backend/services/product
    environment:
      - SERVER_NAME=SERVER-1
    env_file:
      - ./backend/services/product/.env
    ports:
      - "5004:8004"
